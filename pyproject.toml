[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "angio"
version = "0.0.1"
description = "Watch your model learn, from the inside. Live training visualization and diagnosis for PyTorch."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Lokesh" }]
keywords = ["pytorch", "deep-learning", "visualization", "training", "debugging"]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
angio = "angio.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/angio"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "gpu: tests that need a CUDA GPU",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true